[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-TranslateModel"
version = "0.3.1"
description = "A plugin that translates models on the build plate for printing one after the other."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Will MacCormack", email = "willmaccormack@gmail.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3, <4"
dependencies = ["OctoPrint"]

[project.urls]
Homepage = "https://github.com/Willmac16/OctoPrint-TranslateModel"

[project.entry-points."octoprint.plugin"]
translatemodel = "octoprint_translatemodel"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["octoprint_translatemodel", "octoprint_translatemodel.*"]

[[tool.setuptools.ext-modules]]
name = "translate"
sources = ["octoprint_translatemodel/src/translate.cpp"]
