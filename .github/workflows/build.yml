name: build

on:
  # Branch pushes are covered by the pull_request event; listing them here as
  # well would run every commit on an open PR twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # An isolated PEP 517 build of the checked-out tree, which is what
      # OctoPrint's software update plugin does when it pip-installs
      # archive/<tag>.zip. pip resolves build-system.requires against *this*
      # interpreter, so old Pythons get the newest setuptools they can have --
      # that resolution is what failed on 0.3.2 (issue #24).
      - name: Build wheel
        run: pip wheel --no-deps --wheel-dir dist .

      # --no-deps keeps this to seconds and skips OctoPrint's dependency tree;
      # the checks below never need OctoPrint importable.
      - name: Install wheel
        run: pip install --no-deps dist/*.whl

      - name: Check wheel contents and extension
        run: python .github/scripts/check_build.py dist/*.whl

  plugin-loads:
    name: OctoPrint plugin discovery (${{ matrix.octoprint }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable is whatever `pip install OctoPrint` gives a user today; 2.0 is
        # the next major, in rc since April 2026 and the release that raises
        # OctoPrint's own Python floor to 3.9.
        octoprint: [stable, "2.0-prerelease"]
    # 3.11 is what OctoPi's bookworm image ships, so it is the most
    # representative single version to test discovery on, and it is supported by
    # both OctoPrint 1.11 and 2.0. (It is also the floor for the tomllib the
    # check script uses to read pyproject.toml.)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        run: pip wheel --no-deps --wheel-dir dist .

      # Unlike the build jobs, this one installs dependencies: the point is to
      # load the plugin against a real OctoPrint.
      - name: Install wheel with OctoPrint
        run: pip install dist/*.whl

      # Upgrading after the fact rather than resolving 2.0 up front, because
      # that is the order real users hit it: plugin already installed, then
      # OctoPrint moves to the new major.
      - name: Upgrade to the OctoPrint 2.0 prerelease
        if: matrix.octoprint == '2.0-prerelease'
        run: pip install --upgrade --pre "OctoPrint>=2.0.0rc1,<3"

      - name: Report OctoPrint version
        run: python -c "import octoprint; print(octoprint.__version__)"

      - name: Check OctoPrint discovers and loads the plugin
        run: python .github/scripts/check_plugin_load.py

  build-py37:
    name: py3.7 (container)
    runs-on: ubuntu-latest
    # setup-python has no 3.7 build for ubuntu-24.04 (its manifest stops at
    # 22.04), so 3.7 is tested in the official image instead. bullseye rather
    # than buster: the runner injects its own Node into the container to run
    # actions/checkout (Node 24 as of v7), which needs glibc >= 2.28. Bullseye
    # has 2.31; buster sits right on the boundary.
    #
    # Any pip works here -- there is no setuptools >=77 candidate for 3.7 at
    # all, so the 0.3.2 failure reproduces regardless of resolver version.
    container: python:3.7-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        run: pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel
        run: pip install --no-deps dist/*.whl

      - name: Check wheel contents and extension
        run: python .github/scripts/check_build.py dist/*.whl
